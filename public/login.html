<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · FortiGate Backup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c8102e' d='M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='m8.5 12 2.5 2.5 4.5-5'/%3E%3C/svg%3E">
<script>
  // Same theme as the app: the saved choice, else the OS setting.
  {
    let t;
    try { t = localStorage.getItem('theme'); } catch {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
</script>
<style>
  :root {
    color-scheme: light;
    --bg:#fff; --surface:#fff; --surface-2:#f5f5f3; --fg:#1b1b19; --muted:#66655f; --line:#e6e5e1; --line-strong:#cdcbc5;
    --accent:#1b1b19; --accent-hover:#3b3b37; --accent-fg:#fff; --err:#c0281c; --err-soft:#fdecea;
    --focus:#2563eb; --focus-ring:rgb(37 99 235 / .28); --radius:8px; --radius-sm:6px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a18; --surface-2:#20201e; --fg:#ecebe7; --muted:#a3a29b; --line:#2b2b28; --line-strong:#45453f;
    --accent:#ecebe7; --accent-hover:#fff; --accent-fg:#121211; --err:#ff7b72; --err-soft:#3b1815;
    --focus:#6aa8ff; --focus-ring:rgb(106 168 255 / .35);
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; font:14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  form { width:100%; max-width:320px; display:grid; gap:14px; margin-bottom:10vh; }
  h1 { display:flex; align-items:center; gap:8px; margin:0 0 6px; font-size:16px; font-weight:650; letter-spacing:-.01em; }
  h1 svg { width:22px; height:22px; flex:none; }
  label { display:grid; gap:4px; font-size:12.5px; font-weight:500; color:var(--muted); }
  input {
    height:36px; padding:0 10px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--fg); font:inherit; font-size:14px; transition:border-color .12s, box-shadow .12s;
  }
  input:hover { border-color:var(--muted); }
  input:user-invalid:not(:focus) { border-color:var(--err); }
  input:focus { outline:2px solid transparent; border-color:var(--focus); box-shadow:0 0 0 3px var(--focus-ring); }
  button {
    height:36px; margin-top:4px; border:1px solid var(--accent); border-radius:var(--radius-sm); background:var(--accent); color:var(--accent-fg);
    cursor:pointer; font:inherit; font-weight:500; transition:background .12s, border-color .12s;
  }
  button:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button:disabled { opacity:.45; cursor:default; }
  .msg { margin:0; padding:8px 12px; border-radius:var(--radius-sm); background:var(--err-soft); color:var(--err); font-size:13px; }
  .msg:empty { display:none; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/><path fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    FortiGate Backup
  </h1>
  <label>User
    <input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required aria-describedby="msg">
  </label>
  <p class="msg" id="msg" role="alert"></p>
  <button type="submit" id="submitBtn">Log in</button>
</form>
<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

// Where to go afterwards: only a path on this site, never another host.
const next = new URLSearchParams(location.search).get('next') || '/';
const target = /^\/(?![/\\])/.test(next) ? next : '/';

form.onsubmit = async (e) => {
  e.preventDefault();
  btn.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: form.user.value, password: form.password.value }),
    });
    if (res.ok) return location.replace(target);
    msg.textContent = (await res.json().catch(() => ({}))).error || res.statusText;
  } catch {
    msg.textContent = 'Cannot reach the server';
  }
  btn.disabled = false;
  form.password.value = '';
  form.password.focus();
};
</script>
</body>
</html>
